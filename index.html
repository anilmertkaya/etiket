function scoreProduct(p,prof){

    <button class="btn" onclick="addProduct()">${t("addBtn")}${I.arrow}</button><p class="small">${t("obfNote")}</p></div>`)};
window.addProduct=()=>{const name=document.getElementById("an").value.trim(),bar=document.getElementById("ab").value.trim(),s=document.querySelector("#ac .on").dataset.k,inci=document.getElementById("ai").value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);if(!name||!inci.length)return toast(t("needNameInci"));if(bar){const ex=PRODUCTS.find(p=>p.bar===bar);if(ex){toast(t("barExists"));location.hash="#/product/"+ex.id;return}}const cat=["Jel oje","Oje","Akrilik"].includes(s)?"nail":s==="Şampuan"?"hair":"skin";const p={id:"c"+Date.now(),bar,name,brand:t("userAdded"),cat,sub:s,inci,claims:[],custom:true};PRODUCTS.push(p);customProducts.push(p);S.set("custom",customProducts);toast(t("added"));location.hash="#/product/"+p.id};

V.history=()=>{nav("home");render(`<div class="screen">${topbar(t("historyT").toLocaleUpperCase(lang==="tr"?"tr-TR":"en-US"))}<h1>${t("historyT")}</h1><div class="list">${scans.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean).map(p=>{const r=scoreProduct(p,profile);return `<a class="item" href="#/product/${p.id}"><span class="thumb" style="${p.img?`background:url(${esc(p.img)}) center/cover`:``}"></span><span class="col"><span class="title">${esc(pname(p))}</span><span class="muted">${esc(sub(p.sub))}</span></span>${badge(r)}</a>`}).join("")||`<div class="note tint">${t("noScans")}</div>`}</div></div>`)};

V.report=id=>{nav("scan");render(`<div class="screen">${topbar(t("reportT").toLocaleUpperCase(lang==="tr"?"tr-TR":"en-US"))}<h1>${t("reportT")}</h1><p class="muted">${t("reportD")}</p><div class="chips">${t("reportOpts").map((s,i)=>`<button class="pill ${i===0?'on':''}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${s}</button>`).join("")}</div><textarea placeholder="${t("reportPh")}"></textarea><button class="btn" onclick="toast(t('reported'));history.back()">${t("sendBtn")}</button></div>`)};

V.profile=()=>{nav("profile");const skinName=profile.skin.length?profile.skin.map(s=>t("skins")[L.tr.skins.indexOf(s)]).join(", "):null,hn=profile.hair.length?profile.hair.map(s=>t("hairs")[L.tr.hairs.indexOf(s)]).join(", "):null;
  render(`<div class="screen"><h1>${t("profileT")}</h1>
  <div class="card row"><span class="badge" style="background:var(--grad);color:#fff;width:54px;height:54px;font-size:18px">${esc((profile.name||"E")[0].toLocaleUpperCase(lang==="tr"?"tr-TR":"en-US"))}</span><span class="col"><span class="title">${esc(profile.name||t("user"))}</span><span class="muted">${[skinName,hn].filter(Boolean).join(" · ")||t("incomplete")}</span></span><a class="pill sm" href="#/onboarding/1">${t("edit")}</a></div>
  <div class="card"><span class="title">${t("allergies")}</span><div class="chips" style="margin-top:8px">${profile.allergies.map(a=>`<span class="pill sm" style="background:var(--surface2)">${esc(t("allergyList")[L.tr.allergyList.indexOf(a)]||a)}</span>`).join("")||`<span class="muted">${t("none")}</span>`}</div></div>
  <h2>${t("settings")}</h2><div class="list">
    <label class="sw"><span>${t("lang")}</span><select onchange="setLang(this.value,'profile')"><option value="tr" ${lang==='tr'?'selected':''}>Türkçe</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></label>
    <label class="sw"><span class="col"><span>${t("region")}</span><span class="muted">${t("regionD")}</span></span><select onchange="profile.region=this.value;S.set('profile',profile);toast(t('saved'))"><option value="TR" ${profile.region==='TR'?'selected':''}>Türkiye (TİTCK)</option><option value="EU" ${profile.region==='EU'?'selected':''}>EU (CosIng)</option></select></label>
    <label class="sw"><span class="col"><span>${t("dark")}</span><span class="muted">${t("darkD")}</span></span><input type="checkbox" ${(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark'?'checked':''} onchange="document.documentElement.dataset.theme=this.checked?'dark':'light';S.set('theme',this.checked?'dark':'light')"></label>
    <label class="sw"><span class="col"><span>${t("pregMode")}</span><span class="muted">${t("pregModeD")}</span></span><input type="checkbox" ${profile.pregnant?'checked':''} onchange="profile.pregnant=this.checked;S.set('profile',profile)"></label>
  </div>
  <div class="list"><a class="item" href="#/add"><span class="badge" style="background:var(--surface2)">${I.plus}</span><span class="col"><span class="title">${t("addProduct")}</span></span>${I.chev}</a><a class="item" href="#/glossary"><span class="badge" style="background:var(--surface2)">${I.book}</span><span class="col"><span class="title">${t("glossaryT")}</span></span>${I.chev}</a></div>
  <div class="note tint">${AI_ENDPOINT?t("aiStatusOn"):t("aiStatusOff")}</div>
  <h2>${t("dataT")}</h2><div class="card"><p class="muted">${t("dataD")}${SOURCES.join(", ")}. ${t("obf")}</p></div>
  <button class="btn ghost" onclick="if(confirm(t('confirmDel'))){Object.keys(localStorage).filter(k=>k.startsWith('skinsnap:')).forEach(k=>localStorage.removeItem(k));location.reload()}">${t("deleteData")}</button>
  <p class="small">${t("version")}</p></div>`)};

/* ===================== YÖNLENDİRME ===================== */
function render(h){document.getElementById("app").innerHTML=h;document.body.classList.toggle("cam",h.includes('class="screen cam"'));window.scrollTo(0,0)}
function route(){stopCam();const h=location.hash.replace(/^#\/?/,"")||"home";const [path]=h.split("?");const [r,...a]=path.split("/");
  if(!profile.done&&r!=="onboarding"&&r!=="intro"){location.hash="#/intro/0";return}(V[r]||V.home)(...a.map(decodeURIComponent))}
window.addEventListener("hashchange",route);
try{const th=S.get("theme",null);if(th)document.documentElement.dataset.theme=th}catch(e){}
document.documentElement.lang=lang;route();try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{})}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
