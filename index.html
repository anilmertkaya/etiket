  --warn:linear-gradient(135deg,#F2A65A,#F7C59F);--warn-ink:#4A2A00;
  --bad:linear-gradient(135deg,#E05A6D,#F08A9A);--bad-ink:#FFFFFF;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--ground);background-image:var(--pattern);background-size:320px 320px;background-attachment:fixed;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.screen{padding:20px 20px calc(var(--navH) + var(--navGap) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:in .22s ease-out}
.screen.noNav{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));min-height:100vh}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}}
h1{margin:0;font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.9px}
h2{margin:6px 0 0;font-size:17px;font-weight:800;letter-spacing:-.3px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted);font-size:13px;font-weight:500;line-height:1.45}
.small{font-size:11px;color:var(--muted);font-weight:500;text-align:center;line-height:1.45}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:14px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:3px;flex:1}
.title{font-size:15px;font-weight:800;line-height:1.3}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);font:600 14px/1.2 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.pill.on{background:var(--grad);color:#fff;font-weight:700;box-shadow:var(--shadow)}
.pill.sm{min-height:38px;padding:8px 12px;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;width:100%;padding:0 20px;border:0;border-radius:999px;background:var(--grad);color:#fff;font:800 16px/1.2 'Plus Jakarta Sans',sans-serif;cursor:pointer;box-shadow:var(--shadow);text-decoration:none;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.btn svg{flex-shrink:0}
:is(.btn,.pill,.icon,a,input,select,textarea,button):focus-visible{outline:3px solid #4FB3A8;outline-offset:2px}
.icon{width:46px;height:46px;border-radius:23px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0;text-decoration:none;font-size:18px;font-weight:700}
.badge{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;white-space:nowrap}
.b-good{background:var(--good);color:var(--good-ink)}.b-warn{background:var(--warn);color:var(--warn-ink)}.b-bad{background:var(--bad);color:#fff}.b-unk{background:var(--unk);color:#fff}.b-none{background:var(--line);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;line-height:1}
.input{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 8px 6px 18px;border-radius:999px;background:var(--surface)}
.input input{flex:1;border:0;outline:0;background:transparent;font:600 15px 'Plus Jakarta Sans',sans-serif;color:var(--ink);min-width:0;height:40px}
.input .pill{flex-shrink:0}
textarea{width:100%;min-height:120px;border:0;border-radius:18px;padding:14px;background:var(--surface);color:var(--ink);font:500 14px/1.5 'Plus Jakarta Sans',sans-serif;resize:vertical}
select{font:700 14px 'Plus Jakarta Sans',sans-serif;border:0;background:var(--surface2);color:var(--ink);border-radius:999px;padding:8px 12px;max-width:55%}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:24px;color:#fff;background:var(--grad);box-shadow:0 16px 36px rgba(217,106,140,.28)}
.hero .blob{position:absolute;right:-60px;bottom:-70px;width:220px;height:220px;border-radius:110px;background:#fff;opacity:.14;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:122px;padding:16px;background:var(--surface);border-radius:24px;text-decoration:none;color:inherit}
.tile .ico{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border-radius:var(--r);text-decoration:none;color:inherit;border:0;width:100%;text-align:left;font-family:inherit;cursor:pointer}
.thumb{width:50px;height:50px;border-radius:16px;background:var(--surface2);flex-shrink:0}
.score{font-size:62px;line-height:1;font-weight:800;letter-spacing:-3px;white-space:nowrap}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:6px;background:var(--surface);border-radius:999px}
.tabs button{min-height:44px;padding:8px 6px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 13px/1.2 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.tabs button.on{background:var(--grad);color:#fff;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.note{padding:14px 16px;border-radius:18px;background:var(--surface);font-size:13px;line-height:1.5}
.note.tint{background:var(--surface2)}
.gtext{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.bar{position:fixed;left:50%;transform:translateX(-50%);width:min(100% - 32px,448px);bottom:calc(var(--navGap) + env(safe-area-inset-bottom,0px));height:var(--navH);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-radius:999px;background:var(--nav);padding:0 8px;box-shadow:0 16px 32px rgba(42,30,51,.32);z-index:5}
nav.bar a{height:54px;width:54px;margin:0 auto;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#B9A7C4;text-decoration:none;font-size:9px;font-weight:700}
nav.bar a.on{background:var(--grad);color:#fff}
nav.bar:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navH) + var(--navGap) + 14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1}
video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;background:#0B1220;display:block}
.frame{position:relative;border-radius:28px;overflow:hidden}
.frame .line{position:absolute;left:28px;right:28px;top:50%;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 0 18px var(--g2)}
.step{display:flex;gap:14px;padding:14px;background:var(--surface);border-radius:var(--r)}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff}
.msg.ai{align-self:flex-start;background:var(--surface)}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 16px;background:var(--surface);border-radius:18px;font-size:15px;font-weight:700}
label.sw input[type=checkbox]{width:24px;height:24px;accent-color:#D96A8C;flex-shrink:0}
.star{color:#E39A3B;letter-spacing:2px}
.toplink{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13px}
.progress{display:flex;gap:6px}.progress span{width:30px;height:6px;border-radius:3px;background:var(--line)}.progress span.on{background:var(--grad)}
.ring{flex-shrink:0}
</style>

const OBF="https://world.openbeautyfacts.org/api/v2/product/";
async function fetchOBF(code){
  try{const r=await fetch(OBF+encodeURIComponent(code)+".json?fields=product_name,brands,ingredients_text,categories_tags,image_front_small_url");
    if(!r.ok)return null;const j=await r.json();if(j.status!==1||!j.product)return null;const P=j.product;
    const text=P.ingredients_text||"";if(!text.trim())return null;
    const inci=text.split(/[,;]/).map(x=>x.replace(/[\[\]()*.]/g,"").trim()).filter(Boolean);
    const cats=(P.categories_tags||[]).join(" ");const cat=/nail|tirnak|oje/i.test(cats)||inci.some(i=>/METHACRYLATE|HEMA|NITROCELLULOSE/i.test(i))?"nail":/shampoo|hair|sac/i.test(cats)?"hair":"skin";
    const s=cat==="nail"?(/gel/i.test(cats+(P.product_name||""))?"Jel oje":"Oje"):cat==="hair"?"Şampuan":/serum/i.test(cats)?"Serum":/toner|tonik/i.test(cats)?"Tonik":/moistur|cream|krem/i.test(cats)?"Nemlendirici":"Diğer";
    return{id:"obf"+code,bar:code,name:P.product_name||code,brand:P.brands||"",cat,sub:s,inci,claims:[],img:P.image_front_small_url||"",src:"Open Beauty Facts",custom:true}}catch(e){return null}}

function scoreProduct(p,prof){
  let score=100,items=[],unknown=0,cap=100;const seen=new Set();
  p.inci.forEach(raw=>{const key=raw.toUpperCase().trim();const ing=ING[key];if(!ing){unknown++;return}
    ing.flags.forEach(f=>{const r=RULES[f];if(!r||seen.has(key+f))return;seen.add(key+f);if(r.d>0){score-=r.d;items.push({ing:ing.name,key,rule:r,d:r.d})}if(r.cap)cap=Math.min(cap,r.cap)})});
  const unkPct=Math.round(unknown/p.inci.length*100),unkD=Math.floor(unkPct/10)*3;
  if(unkD){score-=unkD;items.push({ing:t("unknownRow")(unknown,p.inci.length),key:null,rule:{label:t("unknownLbl"),src:"Etiket",cls:"none"},d:unkD})}
  score=Math.max(0,Math.min(score,cap));
  const lab=t("labels");const [label,cls]=score>=85?[lab.good,"good"]:score>=65?[lab.warn,"warn"]:score>=40?[lab.high,"warn"]:[lab.bad,"bad"];
  const personal=[];const AL={"HEMA":["HEMA"],"Parfüm":["fragrance","allergen26"],"Fragrance":["fragrance","allergen26"],"Nikel":[],"Nickel":[],"Lanolin":["LANOLIN"],"Metakrilatlar":["methacrylate","nail_allergen"],"Methacrylates":["methacrylate","nail_allergen"],"Paraben":["PARABEN"],"Parabens":["PARABEN"],"Formaldehit":["FORMALDEHYDE"],"Formaldehyde":["FORMALDEHYDE"]};
  (prof.allergies||[]).forEach(a=>{const base=a.split(" (")[0];const keys=AL[base]||[base.toUpperCase()];const hit=p.inci.find(i=>{const k=i.toUpperCase(),ing=ING[k];return keys.some(x=>k.includes(x)||(ing&&ing.flags.includes(x)))});if(hit)personal.push(t("personalAllergy")(base,ING[hit.toUpperCase()]?.name||hit))});
  if(prof.pregnant&&items.some(i=>i.rule.cls==="bad"))personal.push(t("personalPreg"));
  const claims=(p.claims||[]).map(c=>{const k=Object.keys(CLAIMMAP).find(k=>CLAIMMAP[k].some(w=>c.includes(w)));if(!k)return{c,ok:null};return{c,ok:!p.inci.some(i=>i.toUpperCase()===k)}});
  if(p.cat==="nail"){["FORMALDEHYDE","TOLUENE","DIBUTYL PHTHALATE"].forEach(k=>{if(!claims.some(c=>CLAIMMAP[k].some(w=>c.c.includes(w))))claims.push({c:ING[k].name.split(" (")[0],ok:!p.inci.some(i=>i.toUpperCase()===k),auto:true})})}
  const eff={benefit:[],neutral:[],caution:[]};p.inci.forEach(i=>{const g=ING[i.toUpperCase().trim()];if(g&&g.eff)eff[g.eff].push(g.name)});
  return{score,label,cls,items,personal,claims,unknown,eff};
}
const alternatives=(p,prof)=>{const b=scoreProduct(p,prof).score;return PRODUCTS.filter(x=>x.id!==p.id&&x.cat===p.cat&&x.sub===p.sub).map(x=>({p:x,r:scoreProduct(x,prof)})).filter(x=>x.r.score>b).sort((a,b)=>b.r.score-a.r.score)};

window.fl=()=>{const s=document.querySelector("#fs .on")?.dataset.k;const goals=[...document.querySelectorAll("#fg .on")].map(b=>b.dataset.k);const wants={Nem:["GLYCERIN","HYALURON","SQUALANE","CERAMIDE"],Kuruluk:["GLYCERIN","HYALURON","SQUALANE","CERAMIDE"],Yatıştırma:["PANTHENOL","NIACINAMIDE","CERAMIDE"],"Hassasiyet / kızarıklık":["PANTHENOL","CERAMIDE"],Parlaklık:["NIACINAMIDE"],Donukluk:["NIACINAMIDE"],Akne:["NIACINAMIDE"],Leke:["NIACINAMIDE"],Gözenek:["NIACINAMIDE"]};
  const list=PRODUCTS.filter(p=>p.cat!=="nail"&&(!s||p.sub===s)).map(p=>{const r=scoreProduct(p,profile);const fit=goals.filter(g=>(wants[g]||[]).some(w=>p.inci.some(i=>i.toUpperCase().includes(w)))).length;return{p,r,fit}}).sort((a,b)=>b.fit-a.fit||b.r.score-a.r.score);
  document.getElementById("fr").innerHTML=list.map(({p,r,fit})=>`<a class="item" href="#/product/${p.id}">${cell(r)}<span class="col"><span class="title">${esc(pname(p))}</span><span class="muted">${esc(sub(p.sub))} · ${goals.length?(fit===goals.length?t("fullMatch"):fit?t("partMatch"):t("noMatch")):t("pickGoal")}</span></span>${I.chev}</a>`).join("")||`<div class="note tint">${t("noResult")}</div>`};

V.hair=()=>{nav("home");const list=PRODUCTS.filter(p=>p.cat==="hair").map(p=>({p,r:scoreProduct(p,profile)})).sort((a,b)=>b.r.score-a.r.score);const hn=profile.hair.length?profile.hair.map(s=>t("hairs")[L.tr.hairs.indexOf(s)]).join(", "):null;
  render(`<div class="screen">${topbar(t("hair").toUpperCase())}<h1>${t("hairT")}</h1><p class="muted">${hn?hn+" "+t("forHair"):t("noHair")}. ${t("hairDesc")}</p>
    <div class="list">${list.map(({p,r})=>`<a class="item" href="#/product/${p.id}">${cell(r)}<span class="col"><span class="title">${esc(pname(p))}</span><span class="muted">${r.items.length?r.items.map(i=>i.ing.split(" ")[0]).slice(0,3).join(", "):t("noFlags")}</span></span>${I.chev}</a>`).join("")}</div>${disc()}</div>`)};

const FAQ={tr:[[/hema/i,"HEMA, jel ve akrilik tırnakta kullanılan bir monomerdir. ECHA'ya göre cilt hassaslaştırıcıdır ve jel tırnakta en sık görülen alerjendir. AB'de yalnızca profesyonel kullanıma izinlidir. Alerjiniz varsa HEMA içermeyen ürünlere bakın ve ürünün cilde değmemesine dikkat edin."],[/paraben/i,"Parabenler koruyucudur. Metil ve etil paraben AB'de serbestçe izinli; bütil ve propil paraben için konsantrasyon sınırı vardır. Etiket, sınırlı parabenleri \"kısıtlı madde\" olarak gösterir."],[/parf[uü]m|koku/i,"\"Parfum\" bir karışımdır; AB'de 26 koku alerjeni ayrıca listelenmek zorundadır. Hassas cilt için kokusuz ürün önerilir."],[/kuru/i,"Kuru cilt için glycerin, hyaluronik asit, seramid ve squalane içeren ürünler iyi gelir; alkol ve sülfat içeren ürünlerden kaçının."],[/ya[gğ]l[ıi]/i,"Yağlı cilt için niacinamide ve hafif jel nemlendiriciler uygundur. Nemlendiriciyi atlamayın; kuruyan cilt daha çok yağ üretebilir."],[/retinol/i,"Retinol gece kullanılır, düşük dozla başlanır ve gündüz güneş koruyucu şarttır. Hamilelikte önerilmez."],[/hamile|emzir/i,"Hamilelikte retinoidler ve kritik uyarılı ürünlerden kaçının. Profilinizde hamilelik seçiliyse Etiket bu ürünlerde ek uyarı gösterir. Doktorunuza danışın."],[/tpo/i,"TPO, jel ojelerde kullanılan bir fotoinisiyatördü; AB'de 2025'ten itibaren kozmetikte yasaklandı. Eski stoklara dikkat edin."]],
en:[[/hema/i,"HEMA is a monomer used in gel and acrylic nails. ECHA classifies it as a skin sensitizer and it's the most common gel-nail allergen. In the EU it's for professional use only. If you're allergic, look for HEMA-free products and keep product off the skin."],[/paraben/i,"Parabens are preservatives. Methyl- and ethylparaben are freely allowed in the EU; butyl- and propylparaben have concentration limits. Etiket shows limited parabens as \"restricted\"."],[/fragrance|perfume|scent/i,"\"Parfum\" is a mixture; in the EU 26 fragrance allergens must be listed separately. For sensitive skin, fragrance-free is recommended."],[/dry/i,"For dry skin look for glycerin, hyaluronic acid, ceramides and squalane; avoid alcohol and sulfates."],[/oily/i,"For oily skin, niacinamide and light gel moisturizers work well. Don't skip moisturizer; dried-out skin can produce more oil."],[/retinol/i,"Use retinol at night, start low, and wear sunscreen in the day. Not recommended in pregnancy."],[/pregnan|breastfeed/i,"During pregnancy avoid retinoids and products with critical warnings. If pregnancy is set in your profile, Etiket adds an extra warning on those products. Ask your doctor."],[/tpo/i,"TPO was a photoinitiator in gel polish; it's banned in EU cosmetics from 2025. Watch out for old stock."]]};
let chat=S.get("chat",[]);
V.assistant=()=>{nav("home");render(`<div class="screen">${topbar(t("assistant"))}<div class="chips">${t("quick").map(q=>`<button class="pill sm" onclick="ask(this.textContent)">${q}</button>`).join("")}</div>
  <div style="display:flex;flex-direction:column;gap:8px" id="chat"><div class="msg ai">${t("aiHello")}</div>${chat.map(m=>`<div class="msg ${m.me?'me':'ai'}">${esc(m.t)}</div>`).join("")}</div>
  <div class="input"><input id="qq" placeholder="${t("askPh")}" onkeydown="if(event.key==='Enter')ask()"><button class="pill on sm" onclick="ask()">${t("send")}</button></div>
  <button class="pill" onclick="chat=[];S.set('chat',chat);V.assistant()">${t("clearChat")}</button>${disc()}</div>`);window.scrollTo(0,document.body.scrollHeight)};
window.ask=async q=>{q=q||document.getElementById("qq").value.trim();if(!q)return;const hit=FAQ[lang].find(([re])=>re.test(q));const key=Object.keys(ING).find(k=>k.length>4&&q.toUpperCase().includes(k.split(" ")[0]));
  /* Katman 1: kurallar */
  let a=hit?hit[1]:key?`${ING[key].name}: ${ING[key].fn[LI()]}. ${ING[key].note?ING[key].note[LI()]:""}`:null;
  chat.push({me:true,t:q});
  /* Katman 2: ücretsiz API (Worker) */
  if(!a&&profile.aiUrl){chat.push({me:false,t:t("aiThinking"),tmp:true});S.set("chat",chat.filter(m=>!m.tmp));V.assistant();
    const ctx=scans.slice(0,1).map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean).map(p=>`${pname(p)}: ${p.inci.join(", ")}`).join("\n");
    try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),15000);
      const r=await fetch(profile.aiUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({q,lang,context:ctx}),signal:ctrl.signal});
      const j=await r.json();if(r.ok&&j.answer)a=j.answer.trim()+"\n\n"+t("aiSrc")}catch(e){}
    chat=chat.filter(m=>!m.tmp)}
  /* Katman 3 yedek: sabit yanıt */
  chat.push({me:false,t:a||t("aiFallback")});S.set("chat",chat);V.assistant()};

V.add=()=>{nav("scan");const bar=(location.hash.split("bar=")[1]||"");const TRC=L.tr.cats;
  render(`<div class="screen">${topbar(t("addProduct").toUpperCase())}<h1>${t("addT")}</h1><p class="muted">${t("addD")}</p>
    <div class="input"><input id="an" placeholder="${t("prodName")}"></div><div class="input"><input id="ab" inputmode="numeric" placeholder="${t("barcode")}" value="${esc(bar)}"></div>
    <div class="chips" id="ac">${t("cats").map((s,i)=>`<button class="pill ${i===0?'on':''}" data-k="${TRC[i]}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${s}</button>`).join("")}</div>
    <textarea id="ai" placeholder="${t("inciPh")}"></textarea>
    <button class="btn" onclick="addProduct()">${t("addBtn")}${I.arrow}</button><p class="small">${t("obfNote")}</p></div>`)};
window.addProduct=()=>{const name=document.getElementById("an").value.trim(),bar=document.getElementById("ab").value.trim(),s=document.querySelector("#ac .on").dataset.k,inci=document.getElementById("ai").value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);if(!name||!inci.length)return toast(t("needNameInci"));const cat=["Jel oje","Oje","Akrilik"].includes(s)?"nail":s==="Şampuan"?"hair":"skin";const p={id:"c"+Date.now(),bar,name,brand:t("userAdded"),cat,sub:s,inci,claims:[],custom:true};PRODUCTS.push(p);customProducts.push(p);S.set("custom",customProducts);toast(t("added"));location.hash="#/product/"+p.id};

V.history=()=>{nav("home");render(`<div class="screen">${topbar(t("historyT").toUpperCase())}<h1>${t("historyT")}</h1><div class="list">${scans.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean).map(p=>{const r=scoreProduct(p,profile);return `<a class="item" href="#/product/${p.id}"><span class="thumb" style="${p.img?`background:url(${esc(p.img)}) center/cover`:``}"></span><span class="col"><span class="title">${esc(pname(p))}</span><span class="muted">${esc(sub(p.sub))}</span></span>${badge(r)}</a>`}).join("")||`<div class="note tint">${t("noScans")}</div>`}</div></div>`)};

V.report=id=>{nav("scan");render(`<div class="screen">${topbar(t("reportT").toUpperCase())}<h1>${t("reportT")}</h1><p class="muted">${t("reportD")}</p><div class="chips">${t("reportOpts").map((s,i)=>`<button class="pill ${i===0?'on':''}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('on'));this.classList.add('on')">${s}</button>`).join("")}</div><textarea placeholder="${t("reportPh")}"></textarea><button class="btn" onclick="toast(t('reported'));history.back()">${t("sendBtn")}</button></div>`)};

V.profile=()=>{nav("profile");const skinName=profile.skin.length?profile.skin.map(s=>t("skins")[L.tr.skins.indexOf(s)]).join(", "):null,hn=profile.hair.length?profile.hair.map(s=>t("hairs")[L.tr.hairs.indexOf(s)]).join(", "):null;
  render(`<div class="screen"><h1>${t("profileT")}</h1>
  <div class="card row"><span class="badge" style="background:var(--grad);color:#fff;width:54px;height:54px;font-size:18px">${esc((profile.name||"E")[0].toUpperCase())}</span><span class="col"><span class="title">${esc(profile.name||t("user"))}</span><span class="muted">${[skinName,hn].filter(Boolean).join(" · ")||t("incomplete")}</span></span><a class="pill sm" href="#/onboarding/1">${t("edit")}</a></div>
  <div class="card"><span class="title">${t("allergies")}</span><div class="chips" style="margin-top:8px">${profile.allergies.map(a=>`<span class="pill sm" style="background:var(--surface2)">${esc(t("allergyList")[L.tr.allergyList.indexOf(a)]||a)}</span>`).join("")||`<span class="muted">${t("none")}</span>`}</div></div>
  <h2>${t("settings")}</h2><div class="list">
    <label class="sw"><span>${t("lang")}</span><select onchange="setLang(this.value,'profile')"><option value="tr" ${lang==='tr'?'selected':''}>Türkçe</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></label>
    <label class="sw"><span class="col"><span>${t("region")}</span><span class="muted">${t("regionD")}</span></span><select onchange="profile.region=this.value;S.set('profile',profile);toast(t('saved'))"><option value="TR" ${profile.region==='TR'?'selected':''}>Türkiye (TİTCK)</option><option value="EU" ${profile.region==='EU'?'selected':''}>EU (CosIng)</option></select></label>
    <label class="sw"><span class="col"><span>${t("dark")}</span><span class="muted">${t("darkD")}</span></span><input type="checkbox" ${document.documentElement.dataset.theme==='dark'?'checked':''} onchange="document.documentElement.dataset.theme=this.checked?'dark':'light';S.set('theme',this.checked?'dark':'light')"></label>
    <label class="sw"><span class="col"><span>${t("proMode")}</span><span class="muted">${t("proModeD")}</span></span><input type="checkbox" ${profile.pro?'checked':''} onchange="profile.pro=this.checked;S.set('profile',profile)"></label>
    <label class="sw" style="flex-direction:column;align-items:stretch;gap:8px"><span class="col"><span>${t("aiUrl")}</span><span class="muted">${t("aiUrlD")}</span></span><span class="input" style="min-height:46px"><input placeholder="${t("aiPh")}" value="${esc(profile.aiUrl||"")}" onchange="profile.aiUrl=this.value.trim();S.set('profile',profile);toast(t('saved'))"></span></label>
    <label class="sw"><span class="col"><span>${t("pregMode")}</span><span class="muted">${t("pregModeD")}</span></span><input type="checkbox" ${profile.pregnant?'checked':''} onchange="profile.pregnant=this.checked;S.set('profile',profile)"></label>
  </div>
  <h2>${t("dataT")}</h2><div class="card"><p class="muted">${t("dataD")}${SOURCES.join(", ")}. ${t("obf")}</p></div>
  <button class="btn ghost" onclick="if(confirm(t('confirmDel'))){Object.keys(localStorage).filter(k=>k.startsWith('etiket:')).forEach(k=>localStorage.removeItem(k));location.reload()}">${t("deleteData")}</button>
  <p class="small">${t("version")}</p></div>`)};

/* ===================== YÖNLENDİRME ===================== */
function render(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0)}
function route(){stopCam();const h=location.hash.replace(/^#\/?/,"")||"home";const [path]=h.split("?");const [r,...a]=path.split("/");
  if(!profile.done&&r!=="onboarding"){location.hash="#/onboarding/1";return}(V[r]||V.home)(...a.map(decodeURIComponent))}
window.addEventListener("hashchange",route);
try{const th=S.get("theme",null);if(th)document.documentElement.dataset.theme=th}catch(e){}
document.documentElement.lang=lang;route();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
